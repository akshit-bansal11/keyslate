name: Release

# Pushing a v* tag builds the installer and publishes a GitHub release.
# Deployment lives here and nowhere else; CI never releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version" >&2
            exit 1
          fi

      # Runs `npm run build` itself (beforeBuildCommand), then compiles and bundles.
      - run: npx tauri build

      - name: Collect assets
        shell: bash
        run: |
          mkdir release
          cp target/release/bundle/nsis/*-setup.exe release/
          cp target/release/keyslate.exe release/Keyslate-portable.exe
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -l

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.exe

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Keyslate $GITHUB_REF_NAME" --generate-notes --verify-tag
